<svg viewBox="0 0 850 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0a0a" />

  <!-- Styles -->
  <style>
    .line { stroke: #cccccc; stroke-width: 1.5; fill: none; }
    .dashed { stroke-dasharray: 6,4; }
    /* Headers */
    .actor-box { fill: #2d2d2d; stroke: #ffffff; stroke-width: 1.5; }
    .logic-box { fill: #003366; stroke: #00aaff; stroke-width: 1.5; }
    .data-box { fill: #004422; stroke: #00ff88; stroke-width: 1.5; }
    .trade-box { fill: #442200; stroke: #ffaa00; stroke-width: 1.5; }
    
    /* Text */
    .text-white { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 13px; fill: #ffffff; }
    .text-header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #ffffff; }
    .arrow-head { fill: #ffffff; }
    .note-dim { font-size: 11px; fill: #aaaaaa; font-style: italic; }
    
    /* Logic Highlight */
    .match-box { fill: #332b00; stroke: #ffcc00; stroke-width: 1.5; }
  </style>

  <!-- Lifelines -->
  <g transform="translate(0,50)">
    <line x1="100" y1="40" x2="100" y2="730" class="line dashed" />
    <line x1="240" y1="40" x2="240" y2="730" class="line dashed" />
    <line x1="380" y1="40" x2="380" y2="730" class="line dashed" />
    <line x1="520" y1="40" x2="520" y2="730" class="line dashed" />
    <line x1="660" y1="40" x2="660" y2="730" class="line dashed" />
    <line x1="780" y1="40" x2="780" y2="730" class="line dashed" />
  </g>

  <!-- Participant Headers -->
  <g>
    <rect x="50" y="20" width="100" height="40" rx="4" class="actor-box" />
    <text x="100" y="45" class="text-header">Participant</text>
    <rect x="190" y="20" width="100" height="40" rx="4" class="actor-box" />
    <text x="240" y="45" class="text-header">Gateway</text>
    <rect x="330" y="20" width="100" height="40" rx="4" class="logic-box" />
    <text x="380" y="45" class="text-header">OrderBook</text>
    <rect x="470" y="20" width="100" height="40" rx="4" class="data-box" />
    <text x="520" y="45" class="text-header">Bids/Asks</text>
    <rect x="610" y="20" width="100" height="40" rx="4" class="data-box" />
    <text x="660" y="45" class="text-header">OrderMap</text>
    <rect x="730" y="20" width="100" height="40" rx="4" class="trade-box" />
    <text x="780" y="45" class="text-header">Trade</text>
  </g>

  <!-- Sequence Steps -->
  <g transform="translate(0,100)">
    <!-- 1. Limit Sell -->
    <path d="M 100 10 L 235 10" class="line" />
    <polygon points="235,7 240,10 235,13" class="arrow-head" />
    <text x="170" y="0" text-anchor="middle" class="text-white">Limit Sell</text>
    <text x="170" y="15" text-anchor="middle" class="note-dim">100.0 × 10</text>

    <!-- 2. addOrder -->
    <path d="M 240 50 L 375 50" class="line" />
    <polygon points="375,47 380,50 375,53" class="arrow-head" />
    <text x="310" y="45" text-anchor="middle" class="text-white">addOrder()</text>

    <!-- 3. insert / put -->
    <path d="M 380 85 L 515 85" class="line" />
    <polygon points="515,82 520,85 515,88" class="arrow-head" />
    <text x="450" y="80" text-anchor="middle" class="text-white">insert</text>

    <path d="M 380 115 L 655 115" class="line" />
    <polygon points="655,112 660,115 655,118" class="arrow-head" />
    <text x="520" y="110" text-anchor="middle" class="text-white">put</text>

    <!-- 4. matchOrder Logic (Self loop) -->
    <path d="M 380 155 C 420 155, 420 185, 385 185" class="line" />
    <polygon points="385,182 380,185 385,188" class="arrow-head" />
    <text x="425" y="175" class="text-white">matchOrder()</text>

    <!-- 5. Query Bids -->
    <path d="M 380 220 L 515 220" class="line" />
    <polygon points="515,217 520,220 515,223" class="arrow-head" />
    <text x="450" y="215" text-anchor="middle" class="text-white">firstKey()</text>

    <path d="M 520 250 L 385 250" class="line dashed" />
    <polygon points="385,247 380,250 385,253" class="arrow-head" />
    <text x="450" y="245" text-anchor="middle" class="text-white">100.0 (best bid)</text>

    <!-- 6. Match Box Highlight -->
    <rect x="300" y="280" width="160" height="35" rx="3" class="match-box" />
    <text x="380" y="302" text-anchor="middle" class="text-white" font-weight="bold">Match: 100 ≥ 100</text>

    <!-- 7. Peek and logic -->
    <path d="M 380 340 L 515 340" class="line" />
    <polygon points="515,337 520,340 515,343" class="arrow-head" />
    <text x="450" y="335" text-anchor="middle" class="text-white">peek()</text>

    <path d="M 520 370 L 385 370" class="line dashed" />
    <polygon points="385,367 380,370 385,373" class="arrow-head" />
    <text x="450" y="365" text-anchor="middle" class="note-dim">resting buy order</text>

    <!-- 8. Internal logic note -->
    <text x="390" y="405" class="note-dim">qty = min(10,10)</text>
    <text x="390" y="420" class="note-dim">Reduce both volumes</text>

    <!-- 9. Removal -->
    <path d="M 380 450 L 655 450" class="line" />
    <polygon points="655,447 660,450 655,453" class="arrow-head" />
    <text x="520" y="445" text-anchor="middle" class="text-white">remove filled</text>

    <!-- 10. Trade Creation -->
    <path d="M 380 495 L 775 495" class="line" />
    <polygon points="775,492 780,495 775,498" class="arrow-head" />
    <text x="580" y="490" text-anchor="middle" class="text-white" fill="#ffaa00" font-weight="bold">create Trade</text>

    <path d="M 780 525 L 385 525" class="line dashed" />
    <polygon points="385,522 380,525 385,528" class="arrow-head" />
    <text x="580" y="520" text-anchor="middle" class="text-white">Trade(100.0, 10)</text>

    <!-- 11. Return Flow -->
    <path d="M 380 580 L 245 580" class="line dashed" />
    <polygon points="245,577 240,580 245,583" class="arrow-head" />
    <text x="310" y="575" text-anchor="middle" class="text-white">[Trade]</text>

    <path d="M 240 630 L 105 630" class="line dashed" />
    <polygon points="105,627 100,630 105,633" class="arrow-head" />
    <text x="170" y="625" text-anchor="middle" class="text-white">[Trade]</text>
  </g>
</svg>