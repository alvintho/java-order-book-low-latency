<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Definitions -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Engine container gradient -->
    <linearGradient id="engineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Model card gradient -->
    <linearGradient id="modelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Bid (green) gradient -->
    <linearGradient id="bidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Ask (red) gradient -->
    <linearGradient id="askGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Map gradient -->
    <linearGradient id="mapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Util gradient -->
    <linearGradient id="utilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Order Book Engine</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#94a3b8">High-performance limit order book · price-time priority matching</text>

  <!-- Outer engine container -->
  <rect x="30" y="90" width="1140" height="640" rx="16" fill="url(#engineGrad)" stroke="#334155" stroke-width="2"/>
  <text x="55" y="118" font-size="13" font-weight="600" fill="#64748b" letter-spacing="2">ENGINE BOUNDARY</text>

  <!-- ========== LEFT COLUMN: MODEL CARDS ========== -->

  <!-- Order model -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="180" height="92" rx="10" fill="url(#modelGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="150" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Order</text>
    <text x="150" y="196" text-anchor="middle" font-size="11" fill="#dbeafe" font-style="italic">Model</text>
    <line x1="78" y1="206" x2="222" y2="206" stroke="#bfdbfe" stroke-opacity="0.4"/>
    <text x="150" y="222" text-anchor="middle" font-size="10" fill="#e0f2fe">id · side · price · qty</text>
    <text x="150" y="236" text-anchor="middle" font-size="10" fill="#e0f2fe">timestamp · status</text>
  </g>

  <!-- Trade model -->
  <g filter="url(#shadow)">
    <rect x="60" y="350" width="180" height="92" rx="10" fill="url(#modelGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="150" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Trade</text>
    <text x="150" y="396" text-anchor="middle" font-size="11" fill="#dbeafe" font-style="italic">Model</text>
    <line x1="78" y1="406" x2="222" y2="406" stroke="#bfdbfe" stroke-opacity="0.4"/>
    <text x="150" y="422" text-anchor="middle" font-size="10" fill="#e0f2fe">buyId · sellId · price</text>
    <text x="150" y="436" text-anchor="middle" font-size="10" fill="#e0f2fe">qty · execution time</text>
  </g>

  <!-- Instrument model -->
  <g filter="url(#shadow)">
    <rect x="60" y="510" width="180" height="92" rx="10" fill="url(#modelGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="150" y="538" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Instrument</text>
    <text x="150" y="556" text-anchor="middle" font-size="11" fill="#dbeafe" font-style="italic">Model</text>
    <line x1="78" y1="566" x2="222" y2="566" stroke="#bfdbfe" stroke-opacity="0.4"/>
    <text x="150" y="582" text-anchor="middle" font-size="10" fill="#e0f2fe">symbol · tickSize</text>
    <text x="150" y="596" text-anchor="middle" font-size="10" fill="#e0f2fe">lotSize · currency</text>
  </g>

  <!-- ========== CENTER: ORDERBOOK ENGINE ========== -->
  <g filter="url(#shadow)">
    <rect x="290" y="140" width="780" height="470" rx="14" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <text x="310" y="170" font-size="18" font-weight="700" fill="#f1f5f9">OrderBook</text>
    <text x="404" y="170" font-size="13" fill="#94a3b8">· Matching Engine</text>

    <!-- Subtitle line -->
    <line x1="310" y1="182" x2="1050" y2="182" stroke="#1e293b" stroke-width="1"/>

    <!-- BIDS panel -->
    <g>
      <rect x="320" y="200" width="345" height="240" rx="10" fill="#052e1e" stroke="#10b981" stroke-width="1.5"/>
      <rect x="320" y="200" width="345" height="34" rx="10" fill="url(#bidGrad)"/>
      <rect x="320" y="220" width="345" height="14" fill="url(#bidGrad)"/>
      <text x="492" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">BIDS · TreeMap</text>
      <text x="492" y="250" text-anchor="middle" font-size="11" fill="#86efac" font-style="italic">descending price order (best bid first)</text>

      <!-- Price levels -->
      <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12">
        <!-- Level 1 -->
        <rect x="335" y="265" width="80" height="26" rx="4" fill="#064e3b" stroke="#10b981"/>
        <text x="375" y="282" text-anchor="middle" fill="#a7f3d0" font-weight="700">100.00</text>
        <line x1="418" y1="278" x2="445" y2="278" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
        <rect x="448" y="265" width="200" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-opacity="0.6"/>
        <text x="548" y="282" text-anchor="middle" fill="#d1fae5">ArrayDeque⟨Order⟩</text>

        <!-- Level 2 -->
        <rect x="335" y="298" width="80" height="26" rx="4" fill="#064e3b" stroke="#10b981"/>
        <text x="375" y="315" text-anchor="middle" fill="#a7f3d0" font-weight="700">99.99</text>
        <line x1="418" y1="311" x2="445" y2="311" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
        <rect x="448" y="298" width="200" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-opacity="0.6"/>
        <text x="548" y="315" text-anchor="middle" fill="#d1fae5">ArrayDeque⟨Order⟩</text>

        <!-- Level 3 -->
        <rect x="335" y="331" width="80" height="26" rx="4" fill="#064e3b" stroke="#10b981"/>
        <text x="375" y="348" text-anchor="middle" fill="#a7f3d0" font-weight="700">99.98</text>
        <line x1="418" y1="344" x2="445" y2="344" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
        <rect x="448" y="331" width="200" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-opacity="0.6"/>
        <text x="548" y="348" text-anchor="middle" fill="#d1fae5">ArrayDeque⟨Order⟩</text>

        <!-- ellipsis -->
        <text x="492" y="378" text-anchor="middle" fill="#10b981" font-size="14">⋮</text>
      </g>

      <!-- FIFO note -->
      <text x="492" y="408" text-anchor="middle" font-size="10" fill="#6ee7b7">FIFO queue per level → time priority</text>
      <text x="492" y="424" text-anchor="middle" font-size="10" fill="#6ee7b7">O(log N) insert · O(1) best-price peek</text>
    </g>

    <!-- ASKS panel -->
    <g>
      <rect x="695" y="200" width="345" height="240" rx="10" fill="#3f0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="695" y="200" width="345" height="34" rx="10" fill="url(#askGrad)"/>
      <rect x="695" y="220" width="345" height="14" fill="url(#askGrad)"/>
      <text x="867" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ASKS · TreeMap</text>
      <text x="867" y="250" text-anchor="middle" font-size="11" fill="#fecaca" font-style="italic">ascending price order (best ask first)</text>

      <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12">
        <!-- Level 1 -->
        <rect x="710" y="265" width="80" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
        <text x="750" y="282" text-anchor="middle" fill="#fecaca" font-weight="700">100.01</text>
        <line x1="793" y1="278" x2="820" y2="278" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>
        <rect x="823" y="265" width="200" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-opacity="0.6"/>
        <text x="923" y="282" text-anchor="middle" fill="#fee2e2">ArrayDeque⟨Order⟩</text>

        <!-- Level 2 -->
        <rect x="710" y="298" width="80" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
        <text x="750" y="315" text-anchor="middle" fill="#fecaca" font-weight="700">100.02</text>
        <line x1="793" y1="311" x2="820" y2="311" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>
        <rect x="823" y="298" width="200" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-opacity="0.6"/>
        <text x="923" y="315" text-anchor="middle" fill="#fee2e2">ArrayDeque⟨Order⟩</text>

        <!-- Level 3 -->
        <rect x="710" y="331" width="80" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
        <text x="750" y="348" text-anchor="middle" fill="#fecaca" font-weight="700">100.03</text>
        <line x1="793" y1="344" x2="820" y2="344" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>
        <rect x="823" y="331" width="200" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-opacity="0.6"/>
        <text x="923" y="348" text-anchor="middle" fill="#fee2e2">ArrayDeque⟨Order⟩</text>

        <text x="867" y="378" text-anchor="middle" fill="#ef4444" font-size="14">⋮</text>
      </g>

      <text x="867" y="408" text-anchor="middle" font-size="10" fill="#fca5a5">FIFO queue per level → time priority</text>
      <text x="867" y="424" text-anchor="middle" font-size="10" fill="#fca5a5">O(log N) insert · O(1) best-price peek</text>
    </g>

    <!-- Spread indicator between bids/asks -->
    <g>
      <rect x="668" y="265" width="24" height="92" rx="4" fill="#1e293b" stroke="#64748b" stroke-dasharray="3,3"/>
      <text x="680" y="298" text-anchor="middle" font-size="9" fill="#cbd5e1" transform="rotate(-90 680 298)">SPREAD</text>
    </g>

    <!-- Order Map -->
    <g>
      <rect x="320" y="460" width="720" height="80" rx="10" fill="url(#mapGrad)" stroke="#c084fc" stroke-width="1.5"/>
      <text x="680" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">orderMap : HashMap⟨Long, Order⟩</text>
      <line x1="340" y1="498" x2="1020" y2="498" stroke="#e9d5ff" stroke-opacity="0.3"/>
      <text x="680" y="518" text-anchor="middle" font-size="12" fill="#f3e8ff">O(1) lookup by order ID — used for cancel / amend / status queries</text>
      <text x="680" y="534" text-anchor="middle" font-size="11" fill="#e9d5ff" font-style="italic">cross-references the same Order objects held in the Bid/Ask deques</text>
    </g>

    <!-- Matching engine note -->
    <g>
      <rect x="320" y="558" width="720" height="38" rx="8" fill="#0f172a" stroke="#475569" stroke-dasharray="4,3"/>
      <text x="680" y="582" text-anchor="middle" font-size="12" fill="#cbd5e1">
        <tspan font-weight="700" fill="#fbbf24">match()</tspan>
        <tspan>  →  cross book when bid ≥ ask · emit </tspan>
        <tspan font-weight="700" fill="#60a5fa">Trade</tspan>
        <tspan> per fill · price-time priority</tspan>
      </text>
    </g>
  </g>

  <!-- ========== UTILITIES ========== -->
  <g filter="url(#shadow)">
    <rect x="60" y="640" width="1080" height="80" rx="10" fill="url(#utilGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="80" y="668" font-size="15" font-weight="700" fill="#fff">⚙ Utilities</text>
    <line x1="80" y1="678" x2="1120" y2="678" stroke="#fde68a" stroke-opacity="0.4"/>

    <g font-size="12" fill="#fffbeb">
      <text x="80" y="700"><tspan font-weight="700" fill="#fff">IdGenerator</tspan> — monotonic long IDs, zero-alloc (AtomicLong / cache-line padded)</text>
      <text x="620" y="700"><tspan font-weight="700" fill="#fff">Price</tspan> — fixed-point arithmetic (double ↔ long), avoids FP rounding</text>
    </g>
  </g>

  <!-- ========== ARROWS: Models → Engine ========== -->
  <!-- Order → OrderBook (submit) -->
  <g>
    <path d="M 240 196 C 265 196, 270 220, 290 220" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="248" y="186" font-size="10" fill="#93c5fd" font-style="italic">submit</text>
  </g>

  <!-- OrderBook → Trade (emit) -->
  <g>
    <path d="M 290 396 C 270 396, 265 396, 240 396" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="248" y="386" font-size="10" fill="#93c5fd" font-style="italic">emit fills</text>
  </g>

  <!-- Instrument → OrderBook (configure) -->
  <g>
    <path d="M 240 556 C 265 556, 270 540, 290 540" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="248" y="546" font-size="10" fill="#93c5fd" font-style="italic">configures</text>
  </g>

  <!-- Footer -->
  <text x="600" y="760" text-anchor="middle" font-size="11" fill="#64748b">
    Single-threaded hot path · lock-free reads · deterministic matching
  </text>
  <text x="600" y="778" text-anchor="middle" font-size="10" fill="#475569">
    TreeMap (red-black tree) · ArrayDeque (ring buffer) · HashMap (open addressing)
  </text>
</svg>
