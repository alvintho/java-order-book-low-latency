<svg viewBox="0 0 850 950" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0a0a" />

  <!-- Styles -->
  <style>
    .line { stroke: #cccccc; stroke-width: 1.5; fill: none; }
    .dashed { stroke-dasharray: 6,4; }
    /* Headers */
    .actor-box { fill: #2d2d2d; stroke: #ffffff; stroke-width: 1.5; }
    .logic-box { fill: #003366; stroke: #00aaff; stroke-width: 1.5; }
    .data-box { fill: #004422; stroke: #00ff88; stroke-width: 1.5; }
    .trade-box { fill: #442200; stroke: #ffaa00; stroke-width: 1.5; }
    
    /* Text */
    .text-white { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 13px; fill: #ffffff; }
    .text-header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #ffffff; }
    .arrow-head { fill: #ffffff; }
    .note-dim { font-size: 11px; fill: #aaaaaa; font-style: italic; }
    .highlight-red { fill: #ff5555; font-weight: bold; }
    
    /* Iteration Containers */
    .iter-bg { fill: #1a1a1a; stroke: #333333; }
  </style>

  <!-- Lifelines -->
  <g transform="translate(0,50)">
    <line x1="100" y1="40" x2="100" y2="880" class="line dashed" />
    <line x1="240" y1="40" x2="240" y2="880" class="line dashed" />
    <line x1="380" y1="40" x2="380" y2="880" class="line dashed" />
    <line x1="520" y1="40" x2="520" y2="880" class="line dashed" />
    <line x1="660" y1="40" x2="660" y2="880" class="line dashed" />
    <line x1="780" y1="40" x2="780" y2="880" class="line dashed" />
  </g>

  <!-- Participant Headers -->
  <g>
    <rect x="50" y="20" width="100" height="40" rx="4" class="actor-box" />
    <text x="100" y="45" class="text-header">Participant</text>
    <rect x="190" y="20" width="100" height="40" rx="4" class="actor-box" />
    <text x="240" y="45" class="text-header">Gateway</text>
    <rect x="330" y="20" width="100" height="40" rx="4" class="logic-box" />
    <text x="380" y="45" class="text-header">OrderBook</text>
    <rect x="470" y="20" width="100" height="40" rx="4" class="data-box" />
    <text x="520" y="45" class="text-header">Asks</text>
    <rect x="610" y="20" width="100" height="40" rx="4" class="data-box" />
    <text x="660" y="45" class="text-header">OrderMap</text>
    <rect x="730" y="20" width="100" height="40" rx="4" class="trade-box" />
    <text x="780" y="45" class="text-header">Trade</text>
  </g>

  <!-- Step 1: Market Buy Entry -->
  <g transform="translate(0,100)">
    <path d="M 100 10 L 235 10" class="line" />
    <polygon points="235,7 240,10 235,13" class="arrow-head" />
    <text x="170" y="0" text-anchor="middle" class="text-white">Market Buy (qty: 12)</text>

    <path d="M 240 50 L 375 50" class="line" />
    <polygon points="375,47 380,50 375,53" class="arrow-head" />
    <text x="310" y="45" text-anchor="middle" class="text-white">addOrder()</text>

    <!-- Guard Condition -->
    <rect x="310" y="75" width="140" height="40" rx="3" fill="#330000" stroke="#ff4444" />
    <text x="380" y="92" text-anchor="middle" class="text-white highlight-red">isMarket == true</text>
    <text x="380" y="105" text-anchor="middle" class="note-dim">DO NOT insert to book</text>
  </g>

  <!-- Step 2: Loop Iteration 1 -->
  <g transform="translate(0,250)">
    <rect x="345" y="-15" width="450" height="140" rx="5" class="iter-bg" />
    <text x="355" y="5" class="note-dim" fill="#00aaff">Walking Book: Iteration 1</text>
    
    <path d="M 380 20 L 515 20" class="line" />
    <polygon points="515,17 520,20 515,23" class="arrow-head" />
    <text x="450" y="15" text-anchor="middle" class="text-white">firstKey()</text>

    <path d="M 520 50 L 385 50" class="line dashed" />
    <polygon points="385,47 380,50 385,53" class="arrow-head" />
    <text x="450" y="45" text-anchor="middle" class="text-white">100.0 (5 avail)</text>

    <path d="M 380 80 L 775 80" class="line" />
    <polygon points="775,77 780,80 775,83" class="arrow-head" />
    <text x="580" y="75" text-anchor="middle" class="text-white" fill="#ffaa00">trade 5 @ 100.0</text>

    <path d="M 380 110 L 655 110" class="line" />
    <polygon points="655,107 660,110 655,113" class="arrow-head" />
    <text x="520" y="105" text-anchor="middle" class="text-white">remove filled</text>
  </g>

  <!-- Step 3: Loop Iteration 2 -->
  <g transform="translate(0,410)">
    <rect x="345" y="-15" width="450" height="140" rx="5" class="iter-bg" />
    <text x="355" y="5" class="note-dim" fill="#00aaff">Walking Book: Iteration 2</text>

    <path d="M 380 20 L 515 20" class="line" />
    <polygon points="515,17 520,20 515,23" class="arrow-head" />
    <text x="450" y="15" text-anchor="middle" class="text-white">firstKey()</text>

    <path d="M 520 50 L 385 50" class="line dashed" />
    <polygon points="385,47 380,50 385,53" class="arrow-head" />
    <text x="450" y="45" text-anchor="middle" class="text-white">101.0 (5 avail)</text>

    <path d="M 380 80 L 775 80" class="line" />
    <polygon points="775,77 780,80 775,83" class="arrow-head" />
    <text x="580" y="75" text-anchor="middle" class="text-white">trade 5 @ 101.0</text>

    <path d="M 380 110 L 655 110" class="line" />
    <polygon points="655,107 660,110 655,113" class="arrow-head" />
    <text x="520" y="105" text-anchor="middle" class="text-white">remove filled</text>
  </g>

  <!-- Step 4: Loop Iteration 3 -->
  <g transform="translate(0,570)">
    <rect x="345" y="-15" width="450" height="140" rx="5" class="iter-bg" />
    <text x="355" y="5" class="note-dim" fill="#00aaff">Walking Book: Iteration 3</text>

    <path d="M 380 20 L 515 20" class="line" />
    <polygon points="515,17 520,20 515,23" class="arrow-head" />
    <text x="450" y="15" text-anchor="middle" class="text-white">firstKey()</text>

    <path d="M 520 50 L 385 50" class="line dashed" />
    <polygon points="385,47 380,50 385,53" class="arrow-head" />
    <text x="450" y="45" text-anchor="middle" class="text-white">102.0 (5 avail)</text>

    <path d="M 380 80 L 775 80" class="line" />
    <polygon points="775,77 780,80 775,83" class="arrow-head" />
    <text x="580" y="75" text-anchor="middle" class="text-white">trade 2 @ 102.0</text>

    <text x="580" y="110" text-anchor="middle" class="note-dim">(3 remaining in book at 102.0)</text>
  </g>

  <!-- Step 5: Completion -->
  <g transform="translate(0,750)">
    <rect x="320" y="0" width="120" height="40" rx="3" fill="#002200" stroke="#00ff00" />
    <text x="380" y="18" text-anchor="middle" class="text-white" font-weight="bold">Qty Filled</text>
    <text x="380" y="32" text-anchor="middle" class="note-dim">Discard Order</text>

    <path d="M 380 70 L 245 70" class="line dashed" />
    <polygon points="245,67 240,70 245,73" class="arrow-head" />
    <text x="310" y="65" text-anchor="middle" class="text-white">[3 Trades]</text>

    <path d="M 240 110 L 105 110" class="line dashed" />
    <polygon points="105,107 100,110 105,113" class="arrow-head" />
    <text x="170" y="105" text-anchor="middle" class="text-white">[3 Trades]</text>
  </g>
</svg>